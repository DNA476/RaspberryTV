backend = "xrender";
vsync = true;
shadow = false;
fading = false;
unredir-if-possible = true;
unredir-if-possible-delay = 200;
# Honor fullscreen stacking rather than an app's unconditional bypass request.
# The fullscreen Qt overlay must keep alpha composition enabled.
rules = (
    { unredir = true; },
    { match = "class_g = 'Raspberry TV'"; unredir = false; }
);
